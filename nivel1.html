<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivel 1 - Mi Pequeño Simba</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
"https://hefospvuiewnrcnjslpi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_JOykK5bONcAeCI-PkP2RlA_RxMyag5n";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);
</script>


    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            background:
                radial-gradient(circle at top, #5c123d 0%, #21051b 45%, #090009 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .game {
            width: 100%;
            max-width: 850px;
            background: rgba(20, 5, 20, 0.94);
            border: 2px solid #ff4fa3;
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 0 35px rgba(255, 50, 150, 0.35);
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .level {
            color: #ff75b8;
            font-weight: bold;
            font-size: 18px;
        }

        .xp {
            background: #2c1028;
            border: 1px solid #ff4fa3;
            padding: 10px 18px;
            border-radius: 20px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            color: #ff77bd;
            margin-bottom: 8px;
            font-size: 34px;
        }

        .subtitle {
            text-align: center;
            color: #ffd1e7;
            margin-bottom: 25px;
        }

        .progress-container {
            width: 100%;
            height: 12px;
            background: #321127;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .progress {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff3f9f, #ff9acb);
            transition: width 0.4s;
        }

        .question-box {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 25px;
            padding: 28px;
            border: 1px solid rgba(255, 105, 180, 0.35);
        }

        .number {
            color: #ff70b5;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .question {
            font-size: 25px;
            line-height: 1.4;
            margin-bottom: 25px;
        }

        .answers {
            display: grid;
            gap: 13px;
        }

        .answer {
            width: 100%;
            padding: 16px;
            border: 1px solid #8f3568;
            background: #241020;
            color: white;
            border-radius: 15px;
            cursor: pointer;
            font-size: 17px;
            text-align: left;
            transition: 0.25s;
        }

        .answer:hover {
            background: #451538;
            border-color: #ff5cab;
            transform: translateY(-2px);
        }

        .answer.correct {
            background: #174d36;
            border-color: #45e69b;
        }

        .answer.wrong {
            background: #5a172d;
            border-color: #ff5478;
        }

        .feedback {
            min-height: 55px;
            margin-top: 20px;
            font-size: 18px;
            text-align: center;
            line-height: 1.5;
        }

        .next {
            display: none;
            margin: 20px auto 0;
            padding: 14px 28px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(90deg, #ff3f9f, #ff70b5);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .next:hover {
            transform: scale(1.04);
        }

        .finished {
            display: none;
            text-align: center;
        }

        .finished .heart {
            font-size: 70px;
        }

        .finished h2 {
            color: #ff7abb;
            font-size: 32px;
        }

        .finished p {
            color: #ffd8e9;
            font-size: 19px;
            line-height: 1.6;
        }

        .map-button {
            margin-top: 20px;
            padding: 15px 30px;
            border: none;
            border-radius: 25px;
            background: #ff4fa3;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .map-button:hover {
            background: #ff76ba;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 27px;
            }

            .question {
                font-size: 21px;
            }

            .game {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<div class="game">

    <div class="top">
        <div class="level">🦁 NIVEL 1</div>
        <div class="xp">⭐ XP: <span id="xp">0</span></div>
    </div>

    <h1>¿Cuánto conoces a tu Samis? 💗</h1>

    <p class="subtitle">
        Pequeño Simba... llegó el momento de demostrar cuánto conoces a tu niña. 🥰
    </p>

    <div class="progress-container">
        <div class="progress" id="progress"></div>
    </div>

    <div id="gameArea">

        <div class="question-box">

            <div class="number" id="number"></div>

            <div class="question" id="question"></div>

            <div class="answers" id="answers"></div>

            <div class="feedback" id="feedback"></div>

            <button class="next" id="next" onclick="siguientePregunta()">
                Siguiente pregunta 💕
            </button>

        </div>

    </div>

    <div class="finished" id="finished">

        <div class="heart">💗🦁💗</div>

        <h2>¡Nivel completado!</h2>

        <p>
            ¡Muy bien, mi pequeño Simba! 🥹❤️<br>
            Has demostrado cuánto conoces a tu Samis.
        </p>

        <p>
            Has conseguido <strong>+600 XP</strong>.
        </p>

        <button class="map-button" onclick="irAlMapa()">
            🗺️ Volver al mapa
        </button>

    </div>

</div>

<script>

    const preguntas = [

        {
            pregunta: "¿Cuál es la comida favorita de Samis? 🍗",
            respuestas: [
                "Pizza 🍕",
                "Pechugas empanizadas 🍗",
                "Tacos 🌮",
                "Hamburguesa 🍔"
            ],
            correcta: 2
        },

        {
            pregunta: "¿Cuál es el color favorito de Samis? 🖤",
            respuestas: [
                "Rosa 💗",
                "Morado 💜",
                "Negro 🖤",
                "Azul 💙"
            ],
            correcta: 2
        },

        {
            pregunta: "¿Qué cosas le gustan a Samis? 😴🍿",
            respuestas: [
                "Dormir",
                "Comer",
                "El drama",
                "Todas las anteriores ❤️"
            ],
            correcta: 3
        },

        {
            pregunta: "¿Qué puede poner de malas a Samis? 😤",
            respuestas: [
                "Que no le hablen",
                "Tus bromas a veces 😂",
                "Que llueva",
                "Que vea películas"
            ],
            correcta: 1
        },

        {
            pregunta: "¿Cuál es uno de los mayores miedos de Samis? 😰",
            respuestas: [
                "Los perros",
                "La oscuridad",
                "Las alturas",
                "Las arañas"
            ],
            correcta: 2
        },

        {
            pregunta: "¿Qué es lo que más le gusta a Samis de Donovan? 🥰",
            respuestas: [
                "Su sonrisa",
                "Su forma de tratarla",
                "Sus ojos y su cabello",
                "Todo lo anterior ❤️"
            ],
            correcta: 3
        }

    ];

    let preguntaActual = 0;
    let xpGanado = 0;
    let respondida = false;

    const pregunta = document.getElementById("question");
    const respuestas = document.getElementById("answers");
    const numero = document.getElementById("number");
    const feedback = document.getElementById("feedback");
    const next = document.getElementById("next");
    const progress = document.getElementById("progress");
    const xpTexto = document.getElementById("xp");

    function mostrarPregunta() {
        async function guardarRespuestaSupabase(preguntaTexto, respuestaTexto, esCorrecta) {

    const { error } = await supabaseClient
        .from("respuestas_nivel4")
        .insert([{
            pregunta: preguntaTexto,
            respuesta: respuestaTexto,
            tipo: "Nivel 1 - " + (esCorrecta ? "Correcta" : "Incorrecta")
        }]);

    if (error) {
        console.error("Error al guardar respuesta:", error);
    } else {
        console.log("✅ Respuesta guardada en Supabase");
    }
}

        respondida = false;
        next.style.display = "none";
        feedback.innerHTML = "";

        const actual = preguntas[preguntaActual];

        numero.innerText =
            "Pregunta " + (preguntaActual + 1) + " de " + preguntas.length;

        pregunta.innerText = actual.pregunta;

        respuestas.innerHTML = "";

        actual.respuestas.forEach((respuesta, indice) => {

            const boton = document.createElement("button");

            boton.className = "answer";
            boton.innerText = respuesta;

            boton.onclick = function() {
                seleccionarRespuesta(indice, boton);
            };

            respuestas.appendChild(boton);

        });

        const porcentaje =
            (preguntaActual / preguntas.length) * 100;

        progress.style.width = porcentaje + "%";
    }

    function seleccionarRespuesta(indice, boton) {

        if (respondida) return;

        respondida = true;

        const correcta =
            preguntas[preguntaActual].correcta;

        const botones =
            document.querySelectorAll(".answer");

        botones.forEach(b => {
            b.disabled = true;
        });

        if (indice === correcta) {

            boton.classList.add("correct");

            xpGanado += 100;

            feedback.innerHTML =
                "💗 ¡Correcto, mi pequeño Simba! +100 XP";

        } else {

            boton.classList.add("wrong");

            botones[correcta].classList.add("correct");

            feedback.innerHTML =
                "🥺 Casi... La respuesta correcta era: " +
                preguntas[preguntaActual].respuestas[correcta];
        }

        xpTexto.innerText = xpGanado;

        next.style.display = "block";
    }

    function siguientePregunta() {

        preguntaActual++;

        if (preguntaActual >= preguntas.length) {

            terminarNivel();

        } else {

            mostrarPregunta();

        }
    }

    function terminarNivel() {

        progress.style.width = "100%";

        document.getElementById("gameArea").style.display = "none";

        document.getElementById("finished").style.display = "block";

        let xpAnterior =
            parseInt(localStorage.getItem("xp")) || 0;

        let nuevoXP =
            xpAnterior + xpGanado;

        localStorage.setItem("xp", nuevoXP);

        localStorage.setItem("nivel1Completado", "true");

        localStorage.setItem("nivel2Desbloqueado", "true");

    }

    function irAlMapa() {

        window.location.href = "mapa.html";

    }

    mostrarPregunta();

</script>

</body>
</html>
